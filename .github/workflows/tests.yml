name: Tests

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

jobs:
  elixir:
    name: Elixir tests
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      matrix:
        otp: ['26']
        elixir: ['1.16.2']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test test/salad_ui

  js:
    name: JS lint + typecheck + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: assets/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint (Biome)
        run: npx biome check salad_ui/

      - name: Type check (tsc)
        run: npx tsc --noEmit -p jsconfig.json

      - name: Unit tests (Vitest)
        run: npx vitest run

  browser:
    name: Browser tests (Wallaby)
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      matrix:
        otp: ['26']
        elixir: ['1.16.2']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Set up ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Cache storybook deps
        uses: actions/cache@v4
        with:
          path: storybook/deps
          key: ${{ runner.os }}-storybook-deps-${{ hashFiles('storybook/mix.lock') }}
          restore-keys: ${{ runner.os }}-storybook-deps-

      - name: Cache storybook build
        uses: actions/cache@v4
        with:
          path: storybook/_build
          key: ${{ runner.os }}-storybook-build-${{ hashFiles('storybook/mix.lock') }}
          restore-keys: ${{ runner.os }}-storybook-build-

      - name: Install storybook dependencies
        working-directory: storybook
        run: mix deps.get

      - name: Install storybook JS dependencies
        working-directory: storybook/assets
        run: npm install

      - name: Build storybook assets
        working-directory: storybook
        run: |
          mix esbuild default
          mix tailwind default
          mix tailwind storybook

      - name: Compile storybook
        working-directory: storybook
        run: mix compile

      - name: Run browser tests
        working-directory: storybook
        run: mix test test/browser/
